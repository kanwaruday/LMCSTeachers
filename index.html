<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Teacher Portal</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://kanwaruday.github.io">
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff;--green:#15803d;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);min-height:100vh;font-size:13px;line-height:1.6;display:flex;flex-direction:column}

.hdr{background:var(--red);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-bottom:1px solid var(--red-h)}
.hdr-brand h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.hdr-brand p{font-size:9.5px;opacity:.75;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

#appBody{flex:1;overflow:auto;padding:18px 24px;max-width:900px;margin:0 auto;width:100%}
@media(max-width:480px){#appBody{padding:14px 12px}.hdr{padding:0 14px}}

.denied{text-align:center;padding:60px 20px;color:var(--gray)}
.denied .icon{font-size:36px;margin-bottom:10px}
.denied h3{font-size:15px;color:var(--dark);margin-bottom:6px}
.notice{background:#fff3cd;border:1px solid #ffc107;color:#92400e;padding:12px 16px;font-size:12px;border-radius:6px;margin-bottom:16px;line-height:1.6}

.card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px 13px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em;margin:0 0 3px;display:flex;align-items:center;justify-content:space-between}
.card-hint{font-size:11px;color:#8A96A6;margin:0 0 7px}

.row-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row-2col{grid-template-columns:1fr}}
.field-label{display:block;font-size:11px;font-weight:600;color:var(--gray);margin-bottom:5px}
select,input[type=text],textarea{border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12.5px;font-family:inherit;color:var(--dark);background:var(--white);width:100%}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--red)}

.submit-bar{display:flex;justify-content:flex-end;margin-top:10px}
.submit-btn{border:none;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:11px 26px;border-radius:8px;cursor:pointer}
.submit-btn:hover{background:var(--red-h)}
.submit-btn:disabled{opacity:.6;cursor:default}

.dash-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.role-picker{display:flex;gap:6px;flex-wrap:wrap}
.role-btn{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11.5px;font-weight:600;color:var(--gray);cursor:pointer}
.role-btn.active{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.date-refresh-btn{border:1.5px solid var(--border);background:#fff;border-radius:6px;padding:6px;display:flex;align-items:center;cursor:pointer;color:var(--gray)}
.date-refresh-btn:hover{color:var(--red);border-color:var(--red)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--red);color:#fff;padding:7px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:nth-child(even) td{background:#fafafa}
tbody tr:hover td{background:var(--red-lt)}
td{padding:6px 12px;vertical-align:middle}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.pill.none{background:#fee2e2;color:var(--red)}
.pill.ok{background:#dcfce7;color:var(--green)}
.pill.amber{background:#fef3c7;color:var(--amber)}
.pill.revoked{background:#e5e7eb;color:#4b5563}
.pill.urgent{background:#fee2e2;color:var(--red)}
.dash-empty{padding:16px 12px;text-align:center;color:var(--gray)}
.detail-empty{font-size:11.5px;color:var(--gray);padding:6px 0}
.loading-state{text-align:center;padding:40px 20px;color:var(--gray)}
.loading-state .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

.apr-row{cursor:pointer}
.apr-row:hover td{background:var(--red-lt)!important}
.apr-row.expanded td{background:var(--lgray)!important}
.apr-detail-wrap{padding:12px 14px;background:var(--lgray)}
.apr-desc{font-size:12.5px;color:var(--dark);line-height:1.6;margin-bottom:8px;white-space:pre-wrap}
.apr-meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--gray);margin-bottom:10px}
.apr-comments{margin:10px 0}
.apr-comment{background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:12px}
.apr-comment .apr-comment-meta{font-size:10.5px;color:var(--gray);margin-bottom:3px}
.apr-comment-del{color:#B7C0CC;text-decoration:none;font-weight:600}
.apr-comment-del:hover{color:var(--red)}
.apr-reply-hint{font-size:11.5px;color:var(--amber);font-weight:600;margin:8px 0 4px}
.apr-reply-row input{border-color:var(--amber)}
.apr-reply-row button{background:var(--amber)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1}
.add-row button{border:none;background:var(--red);color:#fff;border-radius:6px;padding:0 16px;height:34px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
.add-row button:hover{background:var(--red-h)}
</style>
</head>
<body>

<!-- LMCS Portal auth gate — auth.js is loaded live from LMCSManagement
     (this repo is deliberately separate, per Uday 2026-09-19: distinct
     ownership/branding/app-store path from the admin-facing portal),
     so there is exactly one copy of the session/allowlist logic instead
     of a second one drifting out of sync across two repos. -->
<style>
  #lmcs-gate{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center}
  #lmcs-gate .auth-gate{max-width:380px;margin:0 auto;padding:32px 28px;border:1px solid #ddd;border-top:3px solid #CE0000;border-radius:6px;text-align:center;font-family:'Segoe UI',Arial,sans-serif}
  #lmcs-gate .auth-gate p{color:#555;font-size:13px;line-height:1.6;margin:0 0 20px}
  #lmcs-gate #lmcs-g-signin{display:flex;justify-content:center}
  #lmcs-gate .auth-denied{margin-top:16px;background:#fde8e8;border:1px solid #CE0000;color:#a70000;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;text-align:left}
</style>
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="https://kanwaruday.github.io/LMCSManagement/assets/auth.js"></script>
<script>
(function () {
  if (LMCS.getSession()) { document.getElementById('lmcs-gate').style.display = 'none'; return; }
  LMCS.requireSession('#lmcs-gate-slot').then(function () { window.location.reload(); });
})();
</script>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-brand">
    <h1>LMCS — Teacher Portal</h1>
    <p id="hdrCtx">My Requests (leave & other approvals)</p>
  </div>
  <div class="hdr-right">
    <a href="https://kanwaruday.github.io/LMCSManagement/index.html" class="hdr-btn">← Portal</a>
  </div>
</div>

<div id="appBody">
  <div id="deniedBox" style="display:none"></div>
  <div id="appArea" style="display:none">

    <!-- ══════════════════ MY REQUESTS (Phase 1a) ══════════════════
         Only section that exists today. Timetable, Period Adjustments,
         Forms Hub, tag-based coaching, and SS/incentive visibility are
         later phases (see the LMCS Management vault note) -- adding
         them means adding tabs here, not new pages, matching how every
         other module in this portal family is one page with tabs. -->
    <div class="card" id="aprNewRequestCard">
      <p class="card-title">New Request</p>
      <p class="card-hint">Leave and other requests go to your Principal/Owner for a decision — same as the Approvals workflow they already use.</p>
      <div class="row-2col">
        <div>
          <label class="field-label">Category</label>
          <select id="aprCategory"></select>
        </div>
        <div>
          <label class="field-label">Urgency</label>
          <select id="aprUrgency"><option value="Normal">Normal</option><option value="Urgent">Urgent</option></select>
        </div>
      </div>
      <div style="margin-top:10px">
        <label class="field-label">Title</label>
        <input type="text" id="aprTitle" placeholder="Short summary, e.g. &quot;2 days CL — family event&quot;">
      </div>
      <div style="margin-top:10px">
        <label class="field-label">Description</label>
        <textarea id="aprDescription" rows="4" placeholder="Explain why, with dates and any relevant details"></textarea>
      </div>
      <div style="margin-top:10px">
        <label class="field-label">Evidence link (optional)</label>
        <input type="text" id="aprEvidenceLink" placeholder="Paste a Drive/Photos link if relevant">
      </div>
      <div class="submit-bar">
        <button type="button" class="submit-btn" id="aprSubmitBtn" onclick="submitApprovalRequest()">Submit Request</button>
      </div>
    </div>

    <div class="dash-toolbar">
      <p class="card-title" style="margin:0">My Requests</p>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="aprStatusFilter" class="role-picker"></div>
        <button type="button" class="date-refresh-btn" title="Refresh" onclick="refreshApprovals()">↻</button>
      </div>
    </div>
    <div id="aprListBody"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>

  </div>
</div>

<script>
// ── PDR_BACKEND_URL: same "LMCS Principal's Daily Reporting Backend"
// Apps Script project every other module in this portal family calls
// (see ../LMCSManagement/apps-script/main.gs) -- Teacher Portal is a
// separate repo/frontend, not a separate backend. Keep this in sync
// with PDR_BACKEND_URL in LMCSManagement/principals-daily-reporting/
// index.html and LMCSManagement/hiring/index.html if it's ever
// redeployed. ──────────────────────────────────────────────────────
const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';

// Mirrors APR_TEACHER_CATEGORIES in apps-script/approvals.gs -- keep in
// sync if that list changes. Deliberately narrow for v1 (no Hiring/
// Compensation/Disciplinary categories, which stay Principal-only).
const APR_CATEGORIES = ['Compensatory Leave', 'Other'];
const APR_STATUS_PILLS = ['All', 'Pending', 'Info Requested', 'Approved', 'Rejected', 'Revoked'];
let APR_STATUS_FILTER = 'All';
let aprRes = null;              // full action=approvalslist response (already scoped server-side to "my own")
let aprExpandedId = null;

let SESSION = null;

function aprEsc_(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// DD/MM/YYYY, explicitly -- matches every other page in this portal
// family rather than following the browser's own locale.
function formatDDMMYYYY_(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '/' + mm + '/' + d.getFullYear();
}

function pdrReportAuthFailureIfNeeded_(res) {
  if (res && res.error === 'Not authorized' && window.LMCS && LMCS.notifyAuthFailure) {
    LMCS.notifyAuthFailure();
  }
}

async function pdrPost_(action, body) {
  try {
    const res = await fetch(PDR_BACKEND_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action, idToken: SESSION.idToken }, body))
    }).then(function (r) { return r.json(); });
    return res;
  } catch (err) {
    console.warn('pdrPost_ error (' + action + '):', err);
    return { success: false, error: String(err) };
  }
}

async function loadApprovals() {
  const body = document.getElementById('aprListBody');
  try {
    const res = await fetch(PDR_BACKEND_URL + '?action=approvalslist&idToken=' + encodeURIComponent(SESSION.idToken)).then(function (r) { return r.json(); });
    if (!res.success) {
      body.innerHTML = '<div class="notice">Couldn’t load your requests: ' + aprEsc_(res.error || 'unknown error') + '</div>';
      pdrReportAuthFailureIfNeeded_(res);
      return;
    }
    aprRes = res; // apps-script/approvals.gs's aprList_ already scopes this to caller.email for a Teacher session
    aprRenderStatusFilter_();
    renderMyRequests_();
  } catch (err) {
    body.innerHTML = '<div class="notice">Couldn’t reach the backend: ' + aprEsc_(err.message) + '</div>';
  }
}

function refreshApprovals() {
  aprExpandedId = null;
  document.getElementById('aprListBody').innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';
  loadApprovals();
}

function aprRenderStatusFilter_() {
  document.getElementById('aprStatusFilter').innerHTML = APR_STATUS_PILLS.map(function (s) {
    return '<button class="role-btn' + (s === APR_STATUS_FILTER ? ' active' : '') + '" onclick="aprSelectStatusFilter(\'' + s + '\')">' + s + '</button>';
  }).join('');
}

function aprSelectStatusFilter(status) {
  APR_STATUS_FILTER = status;
  aprExpandedId = null;
  aprRenderStatusFilter_();
  renderMyRequests_();
}

function aprStatusPillClass_(status) {
  if (status === 'Approved') return 'ok';
  if (status === 'Rejected') return 'none';
  if (status === 'Revoked') return 'revoked';
  return 'amber'; // Pending, Info Requested
}

// No campus/School column here -- every row IS "my own", scoped
// server-side, unlike the Principal/Owner Approvals tab which shows a
// campus (or every campus for Owner).
function renderMyRequests_() {
  if (!aprRes) return;
  const body = document.getElementById('aprListBody');
  let rows = aprRes.requests.slice();
  if (APR_STATUS_FILTER !== 'All') rows = rows.filter(function (r) { return r.status === APR_STATUS_FILTER; });

  if (!rows.length) {
    body.innerHTML = '<div class="dash-empty">No ' + (APR_STATUS_FILTER === 'All' ? '' : APR_STATUS_FILTER.toLowerCase() + ' ') + 'requests yet.</div>';
    return;
  }

  body.innerHTML = '<div class="tbl-wrap"><table><thead><tr>' +
    '<th>Title</th><th>Category</th><th>Urgency</th><th>Status</th><th>Requested</th>' +
    '</tr></thead><tbody>' + rows.map(aprRowHtml_).join('') + '</tbody></table></div>';
}

function aprRowHtml_(r) {
  const isExpanded = aprExpandedId === r.id;
  let html = '<tr class="apr-row' + (isExpanded ? ' expanded' : '') + '" onclick="toggleApprovalRow(\'' + r.id + '\')">' +
    '<td>' + aprEsc_(r.title) + '</td><td>' + aprEsc_(r.category) + '</td>' +
    '<td>' + (r.urgency === 'Urgent' ? '<span class="pill urgent">Urgent</span>' : '—') + '</td>' +
    '<td><span class="pill ' + aprStatusPillClass_(r.status) + '">' + r.status + '</span></td>' +
    '<td>' + formatDDMMYYYY_(r.requestedAt) + '</td></tr>';
  if (isExpanded) {
    html += '<tr class="detail-row"><td colspan="5"><div class="apr-detail-wrap" id="aprDetailWrap">' +
      '<div class="loading-state"><div class="spinner"></div>Loading…</div></div></td></tr>';
  }
  return html;
}

async function toggleApprovalRow(id) {
  if (aprExpandedId === id) { aprExpandedId = null; renderMyRequests_(); return; }
  aprExpandedId = id;
  renderMyRequests_(); // shows the spinner row immediately
  const res = await fetch(PDR_BACKEND_URL + '?action=approvaldetail&id=' + encodeURIComponent(id) + '&idToken=' + encodeURIComponent(SESSION.idToken)).then(function (r) { return r.json(); });
  if (!res.success) {
    pdrReportAuthFailureIfNeeded_(res);
    const wrap = document.getElementById('aprDetailWrap');
    if (wrap) wrap.innerHTML = '<div class="notice">Couldn’t load this request: ' + aprEsc_(res.error || 'unknown error') + '</div>';
    return;
  }
  const wrap = document.getElementById('aprDetailWrap');
  if (wrap) wrap.outerHTML = aprDetailHtml_(res);
}

function aprDetailHtml_(res) {
  const r = res.request;
  const meta = [];
  if (r.evidenceLink) meta.push('Evidence: <a href="' + aprEsc_(r.evidenceLink) + '" target="_blank" rel="noopener">link</a>');
  meta.push('Requested on ' + formatDDMMYYYY_(r.requestedAt));
  if (r.decidedBy) meta.push(r.status + ' by ' + aprEsc_(r.decidedBy) + ' on ' + formatDDMMYYYY_(r.decidedAt));
  if (r.decisionNote) meta.push('Note: ' + aprEsc_(r.decisionNote));

  // A Teacher never decides -- res.canDecide is always false for this
  // session, so there's deliberately no decide bar here at all (unlike
  // the Principal/Owner Approvals tab).
  const isReplyMoment = r.status === 'Info Requested'; // every row here is already "my own request"
  const commentBoxHtml = (isReplyMoment ? '<div class="apr-reply-hint">More information was requested — your reply below sends this back to Pending.</div>' : '') +
    '<div class="add-row' + (isReplyMoment ? ' apr-reply-row' : '') + '">' +
    '<input type="text" id="aprCommentInput-' + r.id + '" placeholder="' + (isReplyMoment ? 'Reply with the info requested' : 'Add a comment') + '">' +
    '<button type="button" id="aprCommentPostBtn-' + r.id + '" onclick="submitApprovalComment(\'' + r.id + '\')">' + (isReplyMoment ? 'Reply' : 'Post') + '</button></div>';

  return '<tr class="detail-row"><td colspan="5"><div class="apr-detail-wrap" id="aprDetailWrap">' +
    '<div class="apr-desc">' + aprEsc_(r.description) + '</div>' +
    '<div class="apr-meta-row"><span>' + meta.join('</span><span>') + '</span></div>' +
    '<div class="apr-comments">' + aprCommentsHtml_(res.comments, r.id) + '</div>' +
    commentBoxHtml +
    '</div></td></tr>';
}

function aprCommentsHtml_(comments, approvalId) {
  if (!comments.length) return '<div class="detail-empty">No comments yet.</div>';
  return comments.map(function (c) {
    const canDelete = c.authorEmail === SESSION.email;
    return '<div class="apr-comment"><div class="apr-comment-meta">' + aprEsc_(c.authorEmail) + ' (' + aprEsc_(c.authorRole || '—') + ') · ' + formatDDMMYYYY_(c.postedAt) +
      (canDelete ? ' · <a href="#" class="apr-comment-del" onclick="deleteApprovalComment(\'' + c.id + '\',\'' + approvalId + '\');return false;">Delete</a>' : '') +
      '</div>' + aprEsc_(c.body) + '</div>';
  }).join('');
}

async function deleteApprovalComment(commentId, approvalId) {
  if (!confirm('Delete this comment?')) return;
  const res = await pdrPost_('deleteapprovalcomment', { id: commentId });
  if (!res.success) { pdrReportAuthFailureIfNeeded_(res); alert('Couldn’t delete that comment' + (res.error ? ': ' + res.error : '') + '.'); return; }
  toggleApprovalRow(approvalId);
  toggleApprovalRow(approvalId); // close then reopen -- cheapest way to pull the fresh comment thread
}

async function submitApprovalComment(id) {
  const input = document.getElementById('aprCommentInput-' + id);
  const btn = document.getElementById('aprCommentPostBtn-' + id);
  if (btn.disabled) return;
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  btn.disabled = true;
  const res = await pdrPost_('addapprovalcomment', { approvalId: id, body: text });
  input.disabled = false;
  btn.disabled = false;
  if (!res.success) { pdrReportAuthFailureIfNeeded_(res); alert('Couldn’t post that comment' + (res.error ? ': ' + res.error : '') + '.'); return; }
  input.value = '';
  if (res.status && aprRes) {
    const cachedRow = aprRes.requests.filter(function (r) { return r.id === id; })[0];
    if (cachedRow) cachedRow.status = res.status;
  }
  toggleApprovalRow(id);
  toggleApprovalRow(id);
}

async function submitApprovalRequest() {
  const btn = document.getElementById('aprSubmitBtn');
  if (btn.disabled) return;
  const category = document.getElementById('aprCategory').value;
  const title = document.getElementById('aprTitle').value.trim();
  const description = document.getElementById('aprDescription').value.trim();
  if (!title || !description) { alert('Title and description are both required.'); return; }
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Submitting…';
  try {
    const res = await pdrPost_('submitapproval', {
      category: category,
      urgency: document.getElementById('aprUrgency').value,
      title: title,
      description: description,
      evidenceLink: document.getElementById('aprEvidenceLink').value.trim(),
    });
    if (!res.success) {
      pdrReportAuthFailureIfNeeded_(res);
      alert('Something went wrong submitting the request' + (res.error ? ': ' + res.error : '') + ' — please try again.');
      return;
    }
    document.getElementById('aprTitle').value = '';
    document.getElementById('aprDescription').value = '';
    document.getElementById('aprEvidenceLink').value = '';
    alert('Request submitted.');
    refreshApprovals();
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

function showDenied_(message) {
  document.getElementById('deniedBox').style.display = 'block';
  document.getElementById('deniedBox').innerHTML =
    '<div class="denied"><div class="icon">🔒</div><h3>Not available</h3><p>' + aprEsc_(message) + '</p></div>';
}

// Matches every other module page's init() pattern: read the cached
// session directly (no requireSession() call here) and run -- the top
// gate script owns sign-in + reload, so by the time this visually
// matters a session already exists. On first load with no cache yet,
// this runs once against a null session (denied box, harmless) while
// the gate overlay hides it; sign-in reloads the page and this reruns
// for real.
function init() {
  SESSION = LMCS.getSession();
  // Teacher Portal is scoped to the Teacher role specifically -- a
  // Principal/Coordinator/Owner already has the full Approvals tab
  // (with campus scoping, decide rights, every category) on their own
  // Principal's Daily Reporting page; this page would just show them a
  // strictly smaller view of the same data.
  if (!SESSION || !LMCS.hasRole(SESSION, 'Teacher')) {
    showDenied_('The Teacher Portal is for Teacher accounts. Principals/Coordinators/Owner already have the full Approvals workflow on the Principal’s Daily Reporting page.');
    return;
  }
  document.getElementById('aprCategory').innerHTML = APR_CATEGORIES.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  document.getElementById('appArea').style.display = '';
  loadApprovals();
}
init();
</script>

</body>
</html>
